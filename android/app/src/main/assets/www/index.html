    <style>
      /* 全局透明背景支持桌面悬浮与安卓沉浸状态栏及防系统字号畸变 */
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent !important;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: auto;
           -moz-user-select: auto;
                user-select: auto;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        -moz-text-size-adjust: 100%;
             text-size-adjust: 100%;
      }
      .looma-boot {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: max(12px, env(safe-area-inset-top, 0px)) 16px 24px;
        background: #F7F1E5;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .looma-boot-bar {
        width: 100%;
        max-width: 1200px;
        height: 52px;
        border-bottom: 1px solid #E4D7C3;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .looma-boot-pill,
      .looma-boot-dot,
      .looma-boot-line {
        background: #EAE0CE;
        animation: looma-boot-pulse 1.8s ease-in-out infinite;
      }
      .looma-boot-pill {
        width: 84px;
        height: 24px;
        border-radius: 999px;
      }
      .looma-boot-dot {
        width: 28px;
        height: 28px;
        border-radius: 8px;
      }
      .looma-boot-card {
        box-sizing: border-box;
        width: 100%;
        max-width: 450px;
        margin-top: 28px;
        padding: 20px;
        background: #FFFCF6;
        border: 1px solid #E4D7C3;
        border-radius: 14px;
        display: grid;
        gap: 12px;
      }
      .looma-boot-line {
        height: 12px;
        border-radius: 6px;
      }
      .looma-boot-line--short { width: 42%; }
      .looma-boot-line--mid { width: 76%; }
      @keyframes looma-boot-pulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 0.95; }
      }
      @media (prefers-reduced-motion: reduce) {
        .looma-boot-pill,
        .looma-boot-dot,
        .looma-boot-line { animation: none; }
      }
    </style>

        </div>
        <div class="looma-boot-card">
          <div class="looma-boot-line looma-boot-line--short"></div>
